<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">TMC</title>
  <desc id="desc">A transparent multi-level cache implementation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102e46" />
      <stop offset="100%" stop-color="#163d37" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2c9cdf" />
      <stop offset="100%" stop-color="#a6ce39" />
    </linearGradient>
  </defs>
  <rect width="900" height="300" rx="24" fill="url(#bg)" />
  <circle cx="790" cy="50" r="120" fill="#a6ce39" opacity="0.08" />
  <circle cx="850" cy="240" r="150" fill="#2c9cdf" opacity="0.08" />
  <rect x="46" y="48" width="128" height="8" rx="4" fill="url(#line)" />
  <text x="46" y="122" fill="#ffffff" font-size="46" font-weight="700" font-family="Segoe UI, Arial, sans-serif">TMC</text>
  <text x="46" y="166" fill="#d8e7ff" font-size="23" font-family="Segoe UI, Arial, sans-serif">Transparent multi-level cache</text>
  <text x="46" y="215" fill="#9fc8ff" font-size="18" font-family="Segoe UI, Arial, sans-serif">Hot-key discovery  •  Invalidation  •  Observability</text>
  <text x="46" y="260" fill="#a6ce39" font-size="17" font-weight="600" font-family="Segoe UI, Arial, sans-serif">JAVA   REDIS   KAFKA   ETCD   DOCKER</text>
